.logo-film:before{

  content:"";

  top:-5px;

  left:10px;

  right:10px;

  height:7px;

}

.logo-film:after{

  content:"";

  position:absolute;

  right:14px;

  top:29px;

  width:5px;

  height:55px;

  border-radius:5px;

/* شخصية صغيرة فوق الحروف */

  z-index:10;

  top:-8px;

  transform:rotate(-4deg);

  filter:
    drop-shadow(
      0 5px 8px rgba(0,0,0,.8)
    );

  animation:
    logoFloat 2.8s ease-in-out infinite;
}

@keyframes logoFloat{

      translateY(0)

  }

<script>

/* =====================================================
   إعدادات
===================================================== */

const API="/api";

const IMG="https://image.tmdb.org/t/p/w500";

const BACKDROP="https://image.tmdb.org/t/p/w1280";

let currentItem=null;

let currentProviders=null;

let currentSeason=1;


/* =====================================================
   التخزين
===================================================== */

let favorites=
JSON.parse(
localStorage.getItem(
"watchEnjoyFavorites"
)||"[]"
);

let history=
JSON.parse(
localStorage.getItem(
"watchEnjoyHistory"
)||"[]"
);


/* =====================================================
   API
===================================================== */

async function api(endpoint, params={}){

  const query=
    new URLSearchParams({
      endpoint,
      ...params
    });

  const response=
    await fetch(
      `${API}?${query.toString()}`
    );

  if(!response.ok){

    throw new Error(
      "API Error"
    );
  }

  return response.json();
}


/* =====================================================
   أدوات
===================================================== */

function escapeHTML(value){

  if(!value)return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function typeName(type){

  if(type==="movie")return "فيلم";

  return "مسلسل";
}


function poster(path){

  return path
    ? IMG+path
    : "";
}


function backdrop(path){

  return path
    ? BACKDROP+path
    : "";
}


/* =====================================================
   البطاقة
===================================================== */

function createCard(item){

  const id=item.id;

  const isFav=
    favorites.includes(
      `${item.media_type||item.type}-${id}`
    );

  return `

    <div
      class="card"
      data-id="${id}"
      data-type="${item.media_type||item.type}"
      onclick="openDetails(${id}, '${item.media_type||item.type}')">

      <div class="poster">

        ${
          item.poster_path

          ?

          `<img
            src="${poster(item.poster_path)}"
            loading="lazy"
            alt="">`

          :

          `<div class="poster-placeholder">
            🎬
          </div>`
        }


        <button
          class="card-fav"
          onclick="event.stopPropagation(); toggleFavorite(${id}, '${item.media_type||item.type}')">

          ${isFav ? "★":"☆"}

        </button>

      </div>


      <div class="info">

        <div class="title">
          ${escapeHTML(item.title||item.name)}
        </div>

        <div class="meta">

          ${
            item.media_type==="movie" ||

/* =====================================================
   مصادر المشاهدة
===================================================== */

async function loadProviders(id,type){

  try{

    const data=
      await api(
        type==="movie"
        ? `movie/${id}/watch/providers`
        : `tv/${id}/watch/providers`
      );


    currentProviders=
      data.results || {};


    /*
      نبدأ بالعراق.
      إذا ما موجود نعرض رسالة.
    */

    const country=
      currentProviders.IQ;


    const box=
      document.getElementById(
        "providers"
      );


    if(!country){

      box.innerHTML=
        `<div class="provider-message">
          لا توجد حاليًا خدمة مشاهدة رسمية
          متاحة في العراق حسب بيانات TMDB.
        </div>`;

      return;
    }


    const list=[];


    [
      ...(country.flatrate||[]),
      ...(country.rent||[]),
      ...(country.buy||[])
    ].forEach(provider=>{

      if(
        !list.some(
          x=>x.provider_id===
            provider.provider_id
        )
      ){

        list.push(provider);

      }

    });


    if(!list.length){

      box.innerHTML=
        `<div class="provider-message">
          لا يوجد مصدر مشاهدة رسمي متاح حاليًا.
        </div>`;

      return;
    }


    box.innerHTML=

      list.map(provider=>`

        <a
          class="provider"
          href="${country.link||"#"}"
          target="_blank"
          rel="noopener noreferrer">

          ${
            provider.logo_path

            ?

            `<img
              src="https://image.tmdb.org/t/p/w92${provider.logo_path}"
              alt="">`

            :

            "📺"
          }

          ${escapeHTML(provider.provider_name)}

        </a>

      `).join("");


    const watch=
      document.getElementById(
        "watchButton"
      );


    watch.disabled=false;

    watch.innerText=
      type==="movie"
      ? "▶ مشاهدة الفيلم"
      : "▶ مشاهدة المسلسل";


  }catch(error){

    console.error(error);

  }

}

function favoriteKey(id,type){

  return `${type}-${id}`;
}


function toggleFavorite(id,type){

  const key=
    favoriteKey(id,type);


  if(
    favorites.includes(key)
  ){

    favorites=
      favorites.filter(
        x=>x!==key
      );

  }else{

    favorites.push(key);

  }


  localStorage.setItem(
    "watchEnjoyFavorites",
    JSON.stringify(favorites)
  );


  renderFavorites();


  /*

  loadHome();

}

/* =====================================================
   آخر ما شاهدت
===================================================== */

function addHistory(id,type){

  const key=
    favoriteKey(id,type);


  history=
    history.filter(
      x=>x!==key
    );


  history.unshift(key);


  history=
    history.slice(0,20);


  localStorage.setItem(
    "watchEnjoyHistory",
    JSON.stringify(history)
  );

}

let searchTimer=null;


function searchContent(){

  clearTimeout(searchTimer);


  const text=
    document
      .getElementById("search")
      .value
      .trim();


  if(!text){

    loadHome();

    return;

  }


  searchTimer=
    setTimeout(
      ()=>performSearch(text),
      400
    );

}


async function performSearch(text){

  const allContainers=[
    "homeMovies",
    "homeSeries",
    "homeAnime",
    "homeCartoon"
  ];


  allContainers.forEach(id=>{

    const el=
      document.getElementById(id);

    if(el){

      el.innerHTML=
        `<div class="loading">
          جاري البحث...
        </div>`;

    }

  });


  try{

    const [
      movies,
      series
    ]=await Promise.all([

      api(
        "search/movie",
        {
          query:text,
          language:"ar-SA",
          page:"1"
        }
      ),

      api(
        "search/tv",
        {
          query:text,
          language:"ar-SA",
          page:"1"
        }
      )

    ]);


    const movieResults=
      movies.results
        .map(x=>({
          ...x,
          media_type:"movie"
        }));


    const seriesResults=
      series.results
        .map(x=>({
          ...x,
          media_type:"tv"
        }));


    const combined=[
      ...movieResults,
      ...seriesResults
    ];


    document.getElementById(
      "hero"
    ).innerHTML="";


    renderList(
      "homeMovies",
      movieResults.slice(0,15)
    );


    renderList(
      "homeSeries",
      seriesResults.slice(0,15)
    );


    renderList(
      "homeAnime",
      seriesResults
        .filter(
          x =>
            x.origin_country &&
            x.origin_country.includes("JP")
        )
        .slice(0,15)
    );


    renderList(
      "homeCartoon",
      seriesResults
        .filter(
          x =>
            !(
              x.origin_country &&
              x.origin_country.includes("JP")
            )
        )
        .slice(0,15)
    );


    if(!combined.length){

      document.getElementById(
        "homeMovies"
      ).innerHTML=
        `<div class="loading">
          لم نجد نتائج.
        </div>`;

    }

  }catch(error){

    console.error(error);

  }

}
