<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watch Enjoy 🎬</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:
radial-gradient(
circle at top,
#292929 0%,
#101010 35%,
#050505 100%
);
color:white;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
}

header{
position:sticky;
top:0;
z-index:30;
padding:14px 15px;
background:rgba(7,7,7,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid #222;
}

.top{
height:45px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.logo{
font-size:27px;
font-weight:800;
}

.menu-button,
.search-button{
position:absolute;
top:0;
width:43px;
height:43px;
border:1px solid #333;
border-radius:12px;
background:#181818;
color:white;
font-size:21px;
}

.menu-button{
right:0;
}

.search-button{
left:0;
}

.search-box{
display:none;
margin-top:12px;
}

.search-box.show{
display:block;
}

.search{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #333;
background:#151515;
color:white;
font-size:16px;
outline:none;
}

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:90;
}

.overlay.show{
display:block;
}

.side-menu{
position:fixed;
top:0;
right:-290px;
width:275px;
height:100vh;
background:#111;
z-index:100;
padding:25px 17px;
box-shadow:-10px 0 35px rgba(0,0,0,.6);
transition:.3s;
}

.side-menu.open{
right:0;
}

.menu-title{
font-size:22px;
font-weight:bold;
margin-bottom:25px;
}

.close-menu{
position:absolute;
left:15px;
top:17px;
width:38px;
height:38px;
border:0;
border-radius:9px;
background:#242424;
color:white;
font-size:22px;
}

.menu-item{
width:100%;
padding:15px;
margin-bottom:9px;
border:0;
border-radius:12px;
background:#1b1b1b;
color:white;
text-align:right;
font-size:16px;
}

main{
max-width:1300px;
margin:auto;
padding:15px 15px 50px;
}

.page{
display:none;
}

.hero-title{
font-size:21px;
font-weight:bold;
margin:15px 0;
}

.hero{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
overflow:hidden;
}

.hero-card{
position:relative;
height:300px;
border-radius:16px;
overflow:hidden;
background:#151515;
}

.hero-card img{
width:100%;
height:100%;
object-fit:cover;
}

.hero-info{
position:absolute;
bottom:0;
right:0;
left:0;
padding:14px;
background:
linear-gradient(
transparent,
rgba(0,0,0,.95)
);
}

.hero-name{
font-size:15px;
font-weight:bold;
}

.section{
margin-top:30px;
}

.section-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:13px;
}

.section-header h2{
margin:0;
font-size:20px;
}

.section-header span{
font-size:12px;
color:#777;
}

.horizontal{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:7px;
scrollbar-width:none;
}

.horizontal::-webkit-scrollbar{
display:none;
}

.card{
flex:0 0 155px;
background:#151515;
border:1px solid #242424;
border-radius:13px;
overflow:hidden;
}

.poster{
height:220px;
background:#222;
}

.poster img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.info{
padding:10px;
}

.title{
font-size:14px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.meta{
font-size:11px;
color:#888;
margin-top:5px;
}

.actions{
display:flex;
gap:5px;
margin-top:9px;
}

.watch{
flex:1;
border:0;
border-radius:8px;
padding:8px 4px;
background:white;
color:black;
font-size:12px;
font-weight:bold;
}

.favorite{
width:35px;
border:1px solid #333;
border-radius:8px;
background:#222;
color:white;
font-size:17px;
}

.player{
display:none;
background:#111;
border:1px solid #292929;
border-radius:15px;
padding:15px;
margin-bottom:20px;
}

.player-title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.provider-box{
margin-top:15px;
}

.provider-title{
font-size:19px;
font-weight:bold;
margin-bottom:12px;
}

.provider{
display:flex;
align-items:center;
gap:12px;
padding:12px;
margin-bottom:9px;
background:#1c1c1c;
border:1px solid #303030;
border-radius:11px;
color:white;
text-decoration:none;
}

.provider img{
width:42px;
height:42px;
object-fit:contain;
border-radius:8px;
background:#111;
}

.provider-name{
font-weight:bold;
}

.close-player{
border:0;
background:#292929;
color:white;
padding:10px 15px;
border-radius:9px;
margin-top:15px;
}

.empty{
display:none;
text-align:center;
color:#777;
padding:50px 10px;
}

.loading{
text-align:center;
color:#888;
padding:30px;
}

@media(min-width:700px){

.hero-card{
height:430px;
}

.card{
flex-basis:180px;
}

.poster{
height:250px;
}

}

</style>

</head>

<body>

<div
class="overlay"
id="overlay"
onclick="closeMenu()">
</div>

<div
class="side-menu"
id="sideMenu">

<button
class="close-menu"
onclick="closeMenu()">
×
</button>

<div class="menu-title">
☰ Watch Enjoy
</div>

<button
class="menu-item"
onclick="showPage('home')">
🏠 الرئيسية
</button>

<button
class="menu-item"
onclick="showPage('movies')">
🎬 الأفلام
</button>

<button
class="menu-item"
onclick="showPage('series')">
📺 المسلسلات
</button>

<button
class="menu-item"
onclick="showPage('favorites')">
⭐ المفضلة
</button>

<button
class="menu-item"
onclick="showPage('history')">
🕘 آخر ما شاهدت
</button>

</div>

<header>

<div class="top">

<button
class="menu-button"
onclick="openMenu()">
☰
</button>

<div class="logo">
🎬 Watch Enjoy
</div>

<button
class="search-button"
onclick="toggleSearch()">
🔍
</button>

</div>

<div
class="search-box"
id="searchBox">

<input
class="search"
id="search"
type="search"
placeholder="🔎 ابحث عن فيلم أو مسلسل..."
oninput="searchContent()">

</div>

</header>

<main>

<div
class="player"
id="player">

<div
class="player-title"
id="playerTitle">
🎬 المشاهدة
</div>

<div
class="provider-box"
id="providerBox">
</div>

<button
class="close-player"
onclick="closePlayer()">
✕ إغلاق
</button>

</div>

<section
class="page"
id="homePage"
style="display:block">

<div class="hero-title">
🔥 الأكثر شعبية
</div>

<div
class="hero"
id="hero">

<div class="loading">
جاري تحميل الأفلام...
</div>

</div>

<div class="section">

<div class="section-header">

<h2>🎬 الأفلام</h2>

<span>سحب للمزيد ←</span>

</div>

<div
class="horizontal"
id="homeMovies">
</div>

</div>

<div class="section">

<div class="section-header">

<h2>📺 المسلسلات</h2>

<span>سحب للمزيد ←</span>

</div>

<div
class="horizontal"
id="homeSeries">
</div>

</div>

</section>

<section
class="page"
id="moviesPage">

<div class="section-header">

<h2>🎬 الأفلام</h2>

</div>

<div
class="horizontal"
id="allMovies">
</div>

</section>

<section
class="page"
id="seriesPage">

<div class="section-header">

<h2>📺 المسلسلات</h2>

</div>

<div
class="horizontal"
id="allSeries">
</div>

</section>

<section
class="page"
id="favoritesPage">

<div class="section-header">

<h2>⭐ المفضلة</h2>

</div>

<div
class="horizontal"
id="favoriteGrid">
</div>

<div
class="empty"
id="favoriteEmpty">

⭐ لا توجد عناصر في المفضلة.

</div>

</section>

<section
class="page"
id="historyPage">

<div class="section-header">

<h2>🕘 آخر ما شاهدت</h2>

</div>

<div
class="horizontal"
id="historyGrid">
</div>

<div
class="empty"
id="historyEmpty">

🕘 لا يوجد سجل مشاهدة.

</div>

</section>

</main>

<script>

/* =========================
   إعداد API
========================= */

const API_BASE = "/api";

const IMAGE_BASE =
"https://image.tmdb.org/t/p/w500";


/* =========================
   البيانات
========================= */

let movies = [];
let series = [];

let favorites =
JSON.parse(
localStorage.getItem(
"watchEnjoyFavorites"
) || "[]"
);

let history =
JSON.parse(
localStorage.getItem(
"watchEnjoyHistory"
) || "[]"
);


/* =========================
   طلب API
========================= */

async function api(endpoint, params = {}) {

const query =
new URLSearchParams(params);

query.set(
"endpoint",
endpoint
);

const response =
await fetch(
`${API_BASE}?${query.toString()}`
);

if(!response.ok){

throw new Error(
"API Error"
);

}

return response.json();

}


/* =========================
   تحميل الأفلام
========================= */

async function loadMovies(){

try{

const data =
await api(
"movie/popular",
{
page:1
}
);

movies =
(data.results || []).map(
item => ({
...item,
type:"movie"
})
);

renderMovies();

renderHero();

}catch(error){

console.error(error);

document.getElementById(
"homeMovies"
).innerHTML =
`<div class="loading">
⚠️ تعذر تحميل الأفلام
</div>`;

}

}


/* =========================
   تحميل المسلسلات
========================= */

async function loadSeries(){

try{

const data =
await api(
"tv/popular",
{
page:1
}
);

series =
(data.results || []).map(
item => ({
...item,
type:"series",
title:item.name,
release_date:item.first_air_date
})
);

renderSeries();

}catch(error){

console.error(error);

document.getElementById(
"homeSeries"
).innerHTML =
`<div class="loading">
⚠️ تعذر تحميل المسلسلات
</div>`;

}

}


/* =========================
   البطاقة
========================= */

function createCard(item){

const id =
item.id;

const title =
item.title ||
item.name ||
"بدون اسم";

const year =
(
item.release_date ||
item.first_air_date ||
""
).substring(0,4);

const poster =
item.poster_path
?
IMAGE_BASE + item.poster_path
:
"";

const isFav =
favorites.includes(
`${item.type}-${id}`
);

return `

<div
class="card"
data-id="${id}"
data-type="${item.type}"
data-title="${escapeHtml(title)}">

<div class="poster">

${
poster
?
`<img
src="${poster}"
alt="${escapeHtml(title)}"
loading="lazy">`
:
`<div style="
display:flex;
align-items:center;
justify-content:center;
height:100%;
font-size:50px;
">
🎬
</div>`
}

</div>

<div class="info">

<div class="title">
${escapeHtml(title)}
</div>

<div class="meta">

${
item.type === "movie"
? "فيلم"
: "مسلسل"
}

${year ? " • " + year : ""}

</div>

<div class="actions">

<button
class="watch"
onclick="playTitle(${id}, '${item.type}')">

▶ مشاهدة

</button>

<button
class="favorite"
onclick="toggleFavorite(${id}, '${item.type}')">

${isFav ? "★" : "☆"}

</button>

</div>

</div>

</div>

`;

}


/* =========================
   الرئيسية
========================= */

function renderMovies(){

const html =
movies.map(
createCard
).join("");

document.getElementById(
"homeMovies"
).innerHTML =
html;

document.getElementById(
"allMovies"
).innerHTML =
html;

renderFavorites();

renderHistory();

}


function renderSeries(){

const html =
series.map(
createCard
).join("");

document.getElementById(
"homeSeries"
).innerHTML =
html;

document.getElementById(
"allSeries"
).innerHTML =
html;

renderFavorites();

renderHistory();

}


/* =========================
   العرض الكبير
========================= */

function renderHero(){

const items =
movies.slice(0,3);

document.getElementById(
"hero"
).innerHTML =
items.map(item => {

const title =
item.title || "فيلم";

const poster =
item.backdrop_path
?
"https://image.tmdb.org/t/p/w780"
+
item.backdrop_path
:
(
item.poster_path
?
IMAGE_BASE +
item.poster_path
:
""
);

return `

<div class="hero-card">

${
poster
?
`<img
src="${poster}"
alt="${escapeHtml(title)}">`
:
""
}

<div class="hero-info">

<div class="hero-name">
${escapeHtml(title)}
</div>

</div>

</div>

`;

}).join("");

}


/* =========================
   البحث
========================= */

function toggleSearch(){

const box =
document.getElementById(
"searchBox"
);

box.classList.toggle(
"show"
);

if(box.classList.contains("show")){

document.getElementById(
"search"
).focus();

}

}


async function searchContent(){

const text =
document.getElementById(
"search"
).value
.trim();

if(!text){

renderMovies();
renderSeries();

return;

}

try{

const movieData =
await api(
"search/movie",
{
query:text,
page:1
}
);

const tvData =
await api(
"search/tv",
{
query:text,
page:1
}
);

const movieResults =
(movieData.results || [])
.map(
item => ({
...item,
type:"movie"
})
);

const tvResults =
(tvData.results || [])
.map(
item => ({
...item,
type:"series",
title:item.name,
release_date:item.first_air_date
})
);

document.getElementById(
"homeMovies"
).innerHTML =
movieResults.map(
createCard
).join("")
||
`<div class="loading">
لا توجد نتائج
</div>`;

document.getElementById(
"homeSeries"
).innerHTML =
tvResults.map(
createCard
).join("")
||
`<div class="loading">
لا توجد نتائج
</div>`;

}catch(error){

console.error(error);

}

}


/* =========================
   تشغيل صفحة المشاهدة
========================= */

async function playTitle(id,type){

const item =
type === "movie"
?
movies.find(
x => x.id === id
)
:
series.find(
x => x.id === id
);

if(!item)return;

const title =
item.title ||
item.name ||
"المشاهدة";

document.getElementById(
"playerTitle"
).innerText =
"🎬 " + title;

document.getElementById(
"player"
).style.display =
"block";

document.getElementById(
"providerBox"
).innerHTML = `

<div class="loading">

🔎 جاري البحث عن مصدر مشاهدة رسمي...

</div>

`;

addHistory(
id,
type
);

window.scrollTo({
top:0,
behavior:"smooth"
});

await loadProviders(
id,
type
);

}


/* =========================
   مصادر المشاهدة
========================= */

async function loadProviders(id,type){

try{

const endpoint =
`${type}/${id}/watch/providers`;

const data =
await api(endpoint);

const region =
data.results &&
data.results.IQ;

if(!region){

document.getElementById(
"providerBox"
).innerHTML = `

<div style="
background:#181818;
border:1px solid #292929;
border-radius:12px;
padding:18px;
text-align:center;
color:#aaa;
">

<div style="
font-size:18px;
font-weight:bold;
margin-bottom:8px;
">

📺 لا يوجد مصدر رسمي متاح

</div>

<div style="
font-size:13px;
color:#777;
">

لم نجد خدمة مشاهدة رسمية
متاحة لهذا العنوان في العراق حاليًا.

</div>

</div>

`;

return;

}

let providers = [];

if(region.flatrate){
providers.push(
...region.flatrate
);
}

if(region.rent){
providers.push(
...region.rent
);
}

if(region.buy){
providers.push(
...region.buy
);
}

const unique =
providers.filter(
(provider,index,array) =>
index ===
array.findIndex(
x =>
x.provider_id ===
provider.provider_id
)
);

if(!unique.length){

document.getElementById(
"providerBox"
).innerHTML = `

<div style="
background:#181818;
border:1px solid #292929;
border-radius:12px;
padding:18px;
text-align:center;
color:#aaa;
">

📺 لا توجد خدمة مشاهدة
رسمية متاحة حاليًا في العراق.

</div>

`;

return;

}

document.getElementById(
"providerBox"
).innerHTML = `

<div class="provider-title">

📺 شاهد بشكل رسمي

</div>

${
unique.map(provider => {

const logo =
provider.logo_path
?
"https://image.tmdb.org/t/p/w92"
+
provider.logo_path
:
"";

return `

<a
class="provider"
href="${region.link || "#"}"
target="_blank"
rel="noopener noreferrer">

${
logo
?
`<img
src="${logo}"
alt="">`
:
`<div style="
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
">
🎬
</div>`
}

<div class="provider-name">

${escapeHtml(
provider.provider_name
)}

</div>

</a>

`;

}).join("")
}

<div style="
font-size:11px;
color:#777;
margin-top:10px;
">

سيتم نقلك إلى خدمة المشاهدة الرسمية.

</div>

`;

}catch(error){

console.error(error);

document.getElementById(
"providerBox"
).innerHTML = `

<div style="
background:#181818;
border:1px solid #292929;
border-radius:12px;
padding:18px;
text-align:center;
color:#aaa;
">

⚠️ تعذر الحصول على مصادر المشاهدة.

</div>

`;

}

}


/* =========================
   إغلاق المشغل
========================= */

function closePlayer(){

document.getElementById(
"player"
).style.display =
"none";

}


/* =========================
   المفضلة
========================= */

function toggleFavorite(id,type){

const key =
`${type}-${id}`;

if(
favorites.includes(key)
){

favorites =
favorites.filter(
x => x !== key
);

}else{

favorites.push(key);

}

localStorage.setItem(
"watchEnjoyFavorites",
JSON.stringify(
favorites
)
);

renderMovies();
renderSeries();

renderFavorites();

}


/* =========================
   عرض المفضلة
========================= */

function getItem(id,type){

return type === "movie"
?
movies.find(
x => x.id === id
)
:
series.find(
x => x.id === id
);

}


function renderFavorites(){

const items =
favorites.map(key => {

const parts =
key.split("-");

const type =
parts[0];

const id =
Number(parts[1]);

return getItem(
id,
type
);

}).filter(Boolean);

document.getElementById(
"favoriteGrid"
).innerHTML =
items.map(
createCard
).join("");

document.getElementById(
"favoriteEmpty"
).style.display =
items.length
?
"none"
:
"block";

}


/* =========================
   سجل المشاهدة
========================= */

function addHistory(id,type){

const key =
`${type}-${id}`;

history =
history.filter(
x => x !== key
);

history.unshift(key);

history =
history.slice(0,20);

localStorage.setItem(
"watchEnjoyHistory",
JSON.stringify(
history
)
);

renderHistory();

}


function renderHistory(){

const items =
history.map(key => {

const parts =
key.split("-");

const type =
parts[0];

const id =
Number(parts[1]);

return getItem(
id,
type
);

}).filter(Boolean);

document.getElementById(
"historyGrid"
).innerHTML =
items.map(
createCard
).join("");

document.getElementById(
"historyEmpty"
).style.display =
items.length
?
"none"
:
"block";

}


/* =========================
   القائمة
========================= */

function openMenu(){

document.getElementById(
"sideMenu"
).classList.add(
"open"
);

document.getElementById(
"overlay"
).classList.add(
"show"
);

}


function closeMenu(){

document.getElementById(
"sideMenu"
).classList.remove(
"open"
);

document.getElementById(
"overlay"
).classList.remove(
"show"
);

}


/* =========================
   الصفحات
========================= */

function showPage(page){

closeMenu();

document
.querySelectorAll(".page")
.forEach(
x => x.style.display = "none"
);

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
