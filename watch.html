<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشاهدة - سينمانا</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #101010;
      border-bottom: 1px solid #242424;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #e50914;
      text-decoration: none;
    }

    .back {
      margin-right: auto;
      background: #222;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .container {
      width: min(1100px, 94%);
      margin: 30px auto 60px;
    }

    .loading {
      text-align: center;
      padding: 80px 10px;
      color: #aaa;
      font-size: 18px;
    }

    .error {
      text-align: center;
      background: #171717;
      border-radius: 14px;
      padding: 40px 20px;
      color: #ff6b6b;
    }

    .details {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
      background: linear-gradient(135deg, #151515, #0d0d0d);
      border: 1px solid #242424;
      border-radius: 18px;
      padding: 25px;
      overflow: hidden;
    }

    .poster {
      width: 100%;
      border-radius: 14px;
      display: block;
      box-shadow: 0 15px 40px rgba(0,0,0,.5);
    }

    .info h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .original {
      color: #999;
      margin-bottom: 20px;
    }

    .overview {
      color: #ddd;
      line-height: 1.9;
      font-size: 16px;
      margin: 20px 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }

    .meta span {
      background: #222;
      padding: 8px 12px;
      border-radius: 8px;
      color: #ddd;
    }

    .watch-btn {
      display: inline-block;
      background: #e50914;
      color: white;
      text-decoration: none;
      border: 0;
      padding: 13px 25px;
      border-radius: 9px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    .watch-btn:hover {
      background: #b80710;
    }

    .section {
      margin-top: 35px;
    }

    .section h2 {
      margin-bottom: 18px;
      font-size: 25px;
    }

    .seasons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .season {
      background: #171717;
      color: white;
      border: 1px solid #292929;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      font-size: 15px;
    }

    .season:hover,
    .season.active {
      background: #e50914;
      border-color: #e50914;
    }

    .episodes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 15px;
    }

    .episode {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 15px;
    }

    .episode h3 {
      margin-bottom: 8px;
    }

    .episode p {
      color: #999;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .episode .watch-btn {
      font-size: 14px;
      padding: 9px 15px;
    }

    .player {
      margin-top: 35px;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      display: none;
    }

    .player iframe {
      width: 100%;
      height: 550px;
      border: 0;
    }

    @media (max-width: 700px) {
      .details {
        grid-template-columns: 1fr;
      }

      .poster {
        max-width: 260px;
        margin: auto;
      }

      .info h1 {
        font-size: 27px;
      }

      .player iframe {
        height: 300px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="index.html">سينمانا</a>
  <button class="back" onclick="history.back()">رجوع</button>
</header>

<main class="container">

  <div id="loading" class="loading">
    جاري تحميل المعلومات...
  </div>

  <div id="error" class="error" style="display:none;">
    حدث خطأ أثناء تحميل معلومات العمل.
  </div>

  <section id="content" style="display:none;">

    <div class="details">

      <div>
        <img id="poster" class="poster" src="" alt="Poster">
      </div>

      <div class="info">
        <h1 id="title"></h1>

        <div id="original" class="original"></div>

        <div class="meta">
          <span id="date"></span>
          <span id="rating"></span>
          <span id="type"></span>
          <span id="runtime"></span>
        </div>

        <p id="overview" class="overview"></p>

        <button id="mainWatch" class="watch-btn">
          ▶ مشاهدة
        </button>
      </div>

    </div>

    <div id="seasonsSection" class="section" style="display:none;">
      <h2>المواسم</h2>
      <div id="seasons" class="seasons"></div>
    </div>

    <div id="episodesSection" class="section" style="display:none;">
      <h2 id="episodesTitle">الحلقات</h2>
      <div id="episodes" class="episodes"></div>
    </div>

    <div id="player" class="player">
      <iframe
        id="playerFrame"
        allowfullscreen
        referrerpolicy="no-referrer">
      </iframe>
    </div>

  </section>

</main>

<script>
  /*
    رابط API الخاص بـ Cloudflare Pages Functions.
    إذا كان مسارك مختلفًا، غيّر هذا الرابط فقط.
  */
  const API_URL = "/api";

  const params = new URLSearchParams(location.search);

  const id = params.get("id");
  const type = params.get("type") || "movie";

  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const content = document.getElementById("content");

  const poster = document.getElementById("poster");
  const title = document.getElementById("title");
  const original = document.getElementById("original");
  const date = document.getElementById("date");
  const rating = document.getElementById("rating");
  const typeBox = document.getElementById("type");
  const runtime = document.getElementById("runtime");
  const overview = document.getElementById("overview");
  const mainWatch = document.getElementById("mainWatch");

  const seasonsSection = document.getElementById("seasonsSection");
  const seasons = document.getElementById("seasons");

  const episodesSection = document.getElementById("episodesSection");
  const episodes = document.getElementById("episodes");
  const episodesTitle = document.getElementById("episodesTitle");

  const player = document.getElementById("player");
  const playerFrame = document.getElementById("playerFrame");


  async function api(endpoint, extra = {}) {

    const query = new URLSearchParams({
      endpoint,
      ...extra
    });

    const response = await fetch(`${API_URL}?${query.toString()}`);

    if (!response.ok) {
      throw new Error("API Error");
    }

    return response.json();
  }


  function image(path, size = "w500") {

    if (!path) {
      return "https://via.placeholder.com/500x750?text=No+Poster";
    }

    return `https://image.tmdb.org/t/p/${size}${path}`;
  }


  function showError() {

    loading.style.display = "none";
    content.style.display = "none";
    errorBox.style.display = "block";

  }


  async function loadMovie() {

    const data = await api(`movie/${id}`);

    poster.src = image(data.poster_path);
    title.textContent = data.title || data.name || "بدون عنوان";

    original.textContent =
      data.original_title || data.original_name || "";

    date.textContent =
      data.release_date
        ? `📅 ${data.release_date}`
        : "📅 غير معروف";

    rating.textContent =
      `⭐ ${data.vote_average ? data.vote_average.toFixed(1) : "N/A"}`;

    typeBox.textContent = "🎬 فيلم";

    runtime.textContent =
      data.runtime
        ? `⏱ ${data.runtime} دقيقة`
        : "";

    overview.textContent =
      data.overview || "لا يوجد وصف متاح.";

    /*
      TMDB لا يوفر رابط تشغيل الفيلم.
      لذلك زر المشاهدة يظهر رسالة بدل اختراع رابط غير قانوني.
    */
    mainWatch.onclick = function() {

      alert(
        "هذا العنوان موجود في TMDB، لكن لم يتم العثور على مصدر مشاهدة قانوني مضاف له بعد."
      );

    };

  }


  async function loadTV() {

    const data = await api(`tv/${id}`);

    poster.src = image(data.poster_path);
    title.textContent = data.name || "بدون عنوان";

    original.textContent =
      data.original_name || "";

    date.textContent =
      data.first_air_date
        ? `📅 ${data.first_air_date}`
        : "📅 غير معروف";

    rating.textContent =
      `⭐ ${data.vote_average ? data.vote_average.toFixed(1) : "N/A"}`;

    typeBox.textContent = "📺 مسلسل";

    runtime.textContent =
      data.number_of_seasons
        ? `🎞 ${data.number_of_seasons} مواسم`
        : "";

    overview.textContent =
      data.overview || "لا يوجد وصف متاح.";

    mainWatch.onclick = function() {

      document.getElementById("seasonsSection")
        .scrollIntoView({ behavior: "smooth" });

    };


    if (data.seasons && data.seasons.length) {

      seasonsSection.style.display = "block";

      data.seasons
        .filter(season => season.season_number >= 0)
        .forEach(season => {

          const button = document.createElement("button");

          button.className = "season";

          button.textContent =
            season.name ||
            `الموسم ${season.season_number}`;

          button.onclick = () => {

            document
              .querySelectorAll(".season")
              .forEach(x => x.classList.remove("active"));

            button.classList.add("active");

            loadEpisodes(
              id,
              season.season_number,
              season.name
            );

          };

          seasons.appendChild(button);

        });

    }

  }


  async function loadEpisodes(tvId, seasonNumber, seasonName) {

    try {

      episodesSection.style.display = "block";

      episodes.innerHTML =
        `<div class="loading">جاري تحميل الحلقات...</div>`;

      episodesTitle.textContent =
        seasonName || `الموسم ${seasonNumber}`;

      const data =
        await api(
          `tv/${tvId}/season/${seasonNumber}`
        );

      episodes.innerHTML = "";

      if (!data.episodes || !data.episodes.length) {

        episodes.innerHTML =
          `<div class="loading">لا توجد حلقات متاحة.</div>`;

        return;

      }


      data.episodes.forEach(ep => {

        const card =
          document.createElement("div");

        card.className = "episode";

        const name =
          ep.name ||
          `الحلقة ${ep.episode_number}`;

        const description =
          ep.overview ||
          "لا يوجد وصف للحلقة.";

        card.innerHTML = `
          <h3>
            الحلقة ${ep.episode_number}
          </h3>

          <p>
            ${escapeHTML(name)}
          </p>

          <p>
            ${escapeHTML(description)}
          </p>

          <button class="watch-btn">
            ▶ مشاهدة الحلقة
          </button>
        `;

        const watchButton =
          card.querySelector(".watch-btn");

        watchButton.onclick = () => {

          /*
            لا نضع رابطًا وهميًا.
            أضف مصدرًا قانونيًا للحلقة عندما يكون متوفرًا.
          */

          alert(
            "لم يتم إضافة مصدر مشاهدة قانوني لهذه الحلقة بعد."
          );

        };

        episodes.appendChild(card);

      });

    } catch (e) {

      episodes.innerHTML =
        `<div class="error">
          تعذر تحميل الحلقات.
        </div>`;

    }

  }


  function escapeHTML(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  async function init() {

    if (!id) {

      showError();

      return;

    }

    try {

      if (
        type === "tv" ||
        type === "series" ||
        type === "anime" ||
        type === "cartoon"
      ) {

        await loadTV();

      } else {

        await loadMovie();

      }

      loading.style.display = "none";
      content.style.display = "block";

    } catch (error) {

      console.error(error);

      showError();

    }

  }


  init();

</script>

</body>
</html>
