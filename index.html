<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Enjoy 🎬</title>

<style>
body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 30px 15px;
  background: #111;
}

h1 {
  font-size: 32px;
  margin: 0;
}

p {
  color: #999;
}

input {
  width: 90%;
  max-width: 500px;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #1b1b1b;
  color: white;
  font-size: 16px;
}

main {
  padding: 20px;
}

h2 {
  margin-top: 25px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: #151515;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid #252525;
}

.poster {
  height: 130px;
  border-radius: 10px;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
}

.title {
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}

.watch {
  display: block;
  margin-top: 12px;
  padding: 10px;
  text-align: center;
  background: white;
  color: black;
  text-decoration: none;
  border-radius: 9px;
  font-weight: bold;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
<h1>🎬 Watch Enjoy</h1>
<p>أفلام ومسلسلات</p>

<input
id="search"
type="text"
placeholder="🔎 ابحث عن فيلم أو مسلسل..."
onkeyup="search()">
</header>

<main>

<h2>🎬 الأفلام</h2>

<div class="grid">

<div class="card">
<div class="poster">🍿</div>
<div class="title">أفلام مجانية</div>
<p>محتوى متاح بشكل قانوني</p>

<a
class="watch"
href="https://www.youtube.com/movies"
target="_blank">
▶ مشاهدة
</a>
</div>

<div class="card">
<div class="poster">🎥</div>
<div class="title">فيلم جديد</div>
<p>أضف رابط المشاهدة الرسمي</p>

<a
class="watch"
href="#"
onclick="alert('أضف رابط المشاهدة الرسمي هنا')">
▶ مشاهدة
</a>
</div>

</div>

<h2>📺 المسلسلات</h2>

<div class="grid">

<div class="card">
<div class="poster">📺</div>
<div class="title">مسلسل جديد</div>
<p>أضف رابط المشاهدة الرسمي</p>

<a
class="watch"
href="#"
onclick="alert('أضف رابط المشاهدة الرسمي هنا')">
▶ مشاهدة
</a>
</div>

<div class="card">
<div class="poster">⭐</div>
<div class="title">المفضلة</div>
<p>قائمة المشاهدة</p>

<a
class="watch"
href="#"
onclick="alert('أضف رابط المشاهدة الرسمي هنا')">
▶ مشاهدة
</a>
</div>

</div>

</main>

<script>
function search() {

let text = document
.getElementById("search")
.value
.toLowerCase();

let cards = document
.querySelectorAll(".card");

cards.forEach(function(card) {

let title = card
.querySelector(".title")
.innerText
.toLowerCase();

card.style.display =
title.includes(text)
? "block"
: "none";

});

}
</script>

</body>
</html>
