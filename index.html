*{

html{
scroll-behavior:smooth;
}

margin:0;
background:
radial-gradient(circle at 50% -10%,#292929 0%,#111 35%,#050505 75%);
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
min-height:100vh;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
}

header{
position:sticky;
top:0;
z-index:50;
background:rgba(5,5,5,.88);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid #242424;
padding:12px 15px;
}

.top{
height:50px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px;
}

.logo span{
font-size:26px;
}

.menu-button,
.search-button{
position:absolute;
top:3px;
width:44px;
height:44px;
border-radius:13px;
border:1px solid #303030;
background:#171717;
color:white;
font-size:21px;
}

.menu-button{right:0;}
.search-button{left:0;}

.search-box{
display:none;
margin-top:10px;
}

.search-box.show{display:block;}

.search{
width:100%;
height:47px;
padding:0 15px;
border-radius:13px;
border:1px solid #333;
background:#151515;
color:#fff;
outline:none;
font-size:15px;
}

.search:focus{border-color:#777;}

main{
max-width:1350px;
margin:auto;
padding:15px 14px 70px;
}

.page{display:none;}

.hero{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:10px;
}

.hero-card{
position:relative;
height:310px;
border-radius:17px;
overflow:hidden;
background:#151515;
border:1px solid #292929;
cursor:pointer;
}

.hero-card img{
width:100%;
height:100%;
object-fit:cover;
transition:.4s;
}

.hero-card:hover img{transform:scale(1.05);}

.hero-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent 35%,rgba(0,0,0,.92) 100%);
}

.hero-info{
position:absolute;
z-index:2;
bottom:0;
right:0;
left:0;
padding:15px;
}

.hero-name{
font-size:16px;
font-weight:800;
}

.hero-meta{
font-size:11px;
color:#bbb;
margin-top:5px;
}

.section{margin-top:30px;}

.section-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.section-header h2{
font-size:20px;
margin:0;
}

.section-header span{
font-size:12px;
color:#777;
}

.horizontal{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:8px;
scrollbar-width:none;
}

.horizontal::-webkit-scrollbar{display:none;}

.card{
flex:0 0 145px;
background:#141414;
border:1px solid #272727;
border-radius:14px;
overflow:hidden;
transition:.25s;
}

.card:hover{transform:translateY(-3px);}

.poster{
height:205px;
background:linear-gradient(135deg,#333,#111);
position:relative;
}

.poster img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.type-badge{
position:absolute;
top:7px;
right:7px;
padding:4px 7px;
border-radius:7px;
background:rgba(0,0,0,.75);
font-size:10px;
}

.info{padding:10px;}

.title{
font-size:14px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.meta{
font-size:11px;
color:#858585;
margin-top:5px;
}

.rating{
font-size:11px;
margin-top:5px;
}

.actions{
display:flex;
gap:5px;
margin-top:9px;
}

.watch{
flex:1;
border:0;
border-radius:8px;
padding:8px 4px;
background:#fff;
color:#000;
font-weight:800;
font-size:11px;
}

.favorite{
width:36px;
border:1px solid #333;
border-radius:8px;
background:#222;
color:#fff;
font-size:17px;
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
scrollbar-width:none;
padding-bottom:4px;
}

.categories::-webkit-scrollbar{display:none;}

.category{
flex:0 0 auto;
border:1px solid #303030;
background:#171717;
color:#ddd;
border-radius:11px;
padding:10px 14px;
font-size:13px;
}

.category.active{
background:#fff;
color:#000;
}

.random-box{
background:linear-gradient(135deg,#222,#0e0e0e);
border:1px solid #303030;
border-radius:17px;
padding:17px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.random-text h3{
margin:0 0 5px;
font-size:18px;
}

.random-text p{
margin:0;
font-size:12px;
color:#888;
}

.random-button{
border:0;
border-radius:12px;
background:#fff;
color:#000;
font-weight:900;
padding:12px 16px;
white-space:nowrap;
}

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
z-index:80;
}

.overlay.show{display:block;}

.side-menu{
position:fixed;
z-index:100;
top:0;
right:-310px;
width:290px;
height:100vh;
background:#101010;
padding:25px 17px;
transition:.3s;
box-shadow:-15px 0 40px rgba(0,0,0,.7);
}

.side-menu.open{right:0;}

.close-menu{
position:absolute;
left:15px;
top:16px;
width:40px;
height:40px;
border:0;
border-radius:10px;
background:#252525;
color:#fff;
font-size:22px;
}

.menu-title{
font-size:22px;
font-weight:900;
margin-bottom:25px;
}

.menu-item{
width:100%;
border:0;
border-radius:12px;
background:#1a1a1a;
color:#fff;
padding:14px;
margin-bottom:8px;
text-align:right;
font-size:15px;
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:200;
background:rgba(0,0,0,.82);
padding:15px;
overflow-y:auto;
}

.modal.show{display:block;}

.modal-box{
max-width:850px;
margin:35px auto;
background:#121212;
border:1px solid #292929;
border-radius:20px;
overflow:hidden;
position:relative;
}

.modal-close{
position:absolute;
z-index:5;
left:12px;
top:12px;
width:40px;
height:40px;
border:0;
border-radius:11px;
background:rgba(0,0,0,.7);
color:white;
font-size:21px;
}

.detail-backdrop{
height:280px;
background:#111;
position:relative;
}

.detail-backdrop img{
width:100%;
height:100%;
object-fit:cover;
}

.detail-backdrop:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent 25%,#121212 100%);
}

.detail-content{
padding:20px;
margin-top:-55px;
position:relative;
z-index:2;
}

.detail-title{
font-size:25px;
font-weight:900;
margin-bottom:8px;
}

.detail-meta{
color:#aaa;
font-size:12px;
margin-bottom:15px;
}

.detail-description{
color:#ccc;
font-size:14px;
line-height:1.8;
}

.detail-actions{
display:flex;
gap:8px;
margin-top:18px;
}

.big-watch{
border:0;
border-radius:11px;
background:#fff;
color:#000;
font-weight:900;
padding:12px 20px;
}

.season-select{
width:100%;
margin-top:20px;
padding:12px;
border-radius:11px;
border:1px solid #333;
background:#1b1b1b;
color:#fff;
font-size:14px;
}

.episodes{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:12px;
}

.episode{
background:#1a1a1a;
border:1px solid #292929;
border-radius:11px;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.episode-title{font-size:13px;}

.episode button{
border:0;
border-radius:8px;
background:#fff;
color:#000;
padding:7px 10px;
font-size:11px;
font-weight:800;
}

.player{
display:none;
background:#0c0c0c;
border:1px solid #292929;
border-radius:17px;
padding:12px;
margin-bottom:20px;
}

.player.show{display:block;}

.player video{
width:100%;
max-height:70vh;
background:#000;
border-radius:11px;
}

.player-title{
font-size:17px;
font-weight:800;
padding:8px 2px;
}

.close-player{
border:0;
border-radius:9px;
background:#292929;
color:#fff;
padding:9px 14px;
margin-top:8px;
}

.empty,.loading{
text-align:center;
padding:40px 10px;
color:#777;
width:100%;
}

.notification{
position:fixed;
bottom:20px;
left:20px;
right:20px;
max-width:500px;
margin:auto;
z-index:300;
background:#fff;
color:#000;
padding:13px 16px;
border-radius:12px;
font-size:13px;
font-weight:700;
display:none;
}

@media(max-width:900px){
.hero{grid-template-columns:repeat(3,1fr);}
.hero-card{height:300px;}
}

@media(max-width:650px){
.hero{
display:flex;
overflow-x:auto;
scrollbar-width:none;
gap:9px;
}
.hero::-webkit-scrollbar{display:none;}
.hero-card{
flex:0 0 72%;
height:350px;
}
.card{flex-basis:135px;}
.poster{height:190px;}
.episodes{grid-template-columns:1fr;}
.detail-backdrop{height:230px;}
}

</style>

/* =========================
   الحالة
========================= */

let content = [];

let favorites =
JSON.parse(
localStorage.getItem("watchEnjoyFavorites") || "[]"
);

let history =
JSON.parse(
localStorage.getItem("watchEnjoyHistory") || "[]"
);

let later =
JSON.parse(
localStorage.getItem("watchEnjoyLater") || "[]"
);

let currentDetail = null;
let freeContent = [];


/* =========================
   API
========================= */

async function api(endpoint,params={}){

try{

const query =
new URLSearchParams(params).toString();

const url =
`/api?endpoint=${encodeURIComponent(endpoint)}`
+
(query ? `&${query}` : "");

const response =
await fetch(url);

if(!response.ok)
throw new Error("API Error");

return await response.json();

}catch(error){

console.error(error);

return null;

}

}


/* =========================
   TMDB
========================= */

async function loadTMDB(
endpoint,
type,
extra={}
){

const data =
await api(endpoint,{
language:"ar-SA",
...extra
});

if(!data)
return [];

return (data.results || []).map(item=>({

id:item.id,

title:
item.title ||
item.name ||
"بدون عنوان",

type:type,

year:(
item.release_date ||
item.first_air_date ||
""
).slice(0,4),

description:
item.overview ||
"لا يوجد وصف متوفر لهذا العمل.",

poster:
item.poster_path
?
`https://image.tmdb.org/t/p/w500${item.poster_path}`
:"",

backdrop:
item.backdrop_path
?
`https://image.tmdb.org/t/p/w1280${item.backdrop_path}`
:"",

rating:
Number(item.vote_average || 0)
.toFixed(1),

video:"",

genres:
item.genre_ids || [],

originalLanguage:
item.original_language || ""

}));

}


/* =========================
   تحميل المحتوى
========================= */

async function loadContent(){

const [
movies,
series,
anime,
cartoon,
topMovies,
topSeries
] = await Promise.all([

loadTMDB(
"movie/popular",
"movie"
),

loadTMDB(
"tv/popular",
"series"
),

loadTMDB(
"discover/tv",
"anime",
{
with_genres:"16",
with_original_language:"ja",
sort_by:"popularity.desc"
}
),

loadTMDB(
"discover/tv",
"cartoon",
{
with_genres:"16",
without_original_language:"ja",
sort_by:"popularity.desc"
}
),

loadTMDB(
"movie/top_rated",
"movie"
),

loadTMDB(
"tv/top_rated",
"series"
)

]);

content = [
...movies,
...series,
...anime,
...cartoon,
...topMovies,
...topSeries
];

renderHome(
movies,
series,
anime,
cartoon,
topMovies,
topSeries
);

loadFreeContent();

}


/* =========================
   المكتبة المجانية القانونية
========================= */

async function loadFreeContent(){

const data = await api("free");

freeContent = data && Array.isArray(data.results)
? data.results
: [];

content = [
...content.filter(item => item.type !== "free"),
...freeContent
];

const cards = freeContent.map(createCard).join("");

document.getElementById("homeFree").innerHTML =
cards || `<div class="empty">لا توجد أعمال متاحة حالياً. حاول مرة ثانية لاحقاً.</div>`;

const allFree = document.getElementById("allFree");
if(allFree){
allFree.innerHTML =
cards || `<div class="empty">تعذر تحميل المكتبة حالياً.</div>`;
}

}


/* =========================
   بطاقة
========================= */

function createCard(item){

const safeId = JSON.stringify(item.id);

const fav =
favorites.includes(item.id);

const saved =
later.includes(item.id);

let typeName =
item.type==="free"
?
"ملكية عامة"
:
item.type==="movie"
?
"فيلم"
:
item.type==="series"
?
"مسلسل"
:
item.type==="anime"
?
"أنمي"
:
"كارتون";

return `

<div
class="card"
data-id="${item.id}"
data-type="${item.type}"
onclick="openDetails(${safeId},'${item.type}')">

<div class="poster">

${
item.poster
?
`<img
src="${item.poster}"
alt="${escapeHTML(item.title)}"
loading="lazy">`
:
"🎬"
}

<div class="type-badge">
${typeName}
</div>

</div>

<div class="info">

<div class="title">
${escapeHTML(item.title)}
</div>

<div class="meta">
${item.year || ""}
</div>

<div class="rating">
⭐ ${item.rating}
</div>

<div class="actions">

<button
class="watch"
onclick="event.stopPropagation();playItem(${safeId},'${item.type}')">
▶ مشاهدة
</button>

<button
class="favorite"
onclick="event.stopPropagation();toggleFavorite(${safeId})">
${fav ? "★" : "☆"}
</button>

</div>

</div>

</div>

`;

}

document.getElementById("homeAnime")

/* =========================
   Hero
========================= */

function heroCard(item){

const safeId = JSON.stringify(item.id);

return `

<div
class="hero-card"
onclick="openDetails(${safeId},'${item.type}')">

<img
src="${item.backdrop || item.poster}"
alt="${escapeHTML(item.title)}">

<div class="hero-info">

<div class="hero-name">
${escapeHTML(item.title)}
</div>

<div class="hero-meta">
⭐ ${item.rating}
${item.year ? " • " + item.year : ""}
</div>

</div>

</div>

`;

}


/* =========================
   التفاصيل
========================= */

async function openDetails(
id,
type
){

let item =
content.find(
x =>
x.id===id &&
x.type===type
);

if(!item){

item =
content.find(
x=>x.id===id
);

}

if(!item)
return;

currentDetail = item;

document.getElementById(
"detailTitle"
).innerText =
item.title;

document.getElementById(
"detailDescription"
).innerText =
item.type === "free"
? `${item.description || "لا يوجد وصف متوفر."}\n\nالمصدر: Internet Archive. الترخيص المعلن: الملكية العامة حسب بيانات الرافع، وليس ضماناً مستقلاً لصحة الحقوق.`
: item.description;

document.getElementById(
"detailMeta"
).innerText =
item.type === "free"
? `ملكية عامة معلنة • Internet Archive${item.year ? " • " + item.year : ""} • ملكية عامة معلنة`
: `${typeName(item.type)}`
+
(item.year ? ` • ${item.year}` : "")
+
` • ⭐ ${item.rating}`;

document.getElementById(
"detailBackdrop"
).src =
item.backdrop ||
item.poster ||
"";

document.getElementById(
"detailModal"
).classList.add("show");

document.getElementById(
"detailWatch"
).onclick =
()=>{
playItem(item.id,item.type);
};

document.getElementById(
"detailFavorite"
).onclick =
()=>{
toggleFavorite(item.id);
};

const freeSourceArea = document.getElementById("freeSourceArea");
if(freeSourceArea){
freeSourceArea.innerHTML = item.type === "free"
? `<a href="${item.source}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:14px;color:#bbb;font-size:12px">صفحة المصدر والترخيص في Internet Archive ↗</a>`
: "";
}

if(
item.type==="series" ||
item.type==="anime" ||
item.type==="cartoon"
){

await loadSeasons(item.id);

}else{

document.getElementById(
"seasonArea"
).innerHTML = "";

}

}


/* =========================
   المواسم والحلقات
========================= */

async function loadSeasons(id){

const area =
document.getElementById("seasonArea");

area.innerHTML =
`<div class="loading">
جاري تحميل المواسم...
</div>`;

const data =
await api(`tv/${id}`);

if(
!data ||
!data.seasons
){

area.innerHTML = "";

return;

}

const seasons =
data.seasons
.filter(
s => s.season_number > 0
);

if(!seasons.length){

area.innerHTML = "";

return;

}

area.innerHTML = `

<select
class="season-select"
id="seasonSelect"
onchange="loadEpisodes(${id},this.value)">

${seasons.map(
s=>
`<option value="${s.season_number}">
الموسم ${s.season_number}
${s.episode_count ? ` • ${s.episode_count} حلقة` : ""}
</option>`
).join("")}

</select>

<div
class="episodes"
id="episodes">
</div>

`;

await loadEpisodes(
id,
seasons[0].season_number
);

}
