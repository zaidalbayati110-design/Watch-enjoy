<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Enjoy</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

/* الهيدر */

header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(8,8,8,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #252525;
    padding:15px;
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:800;
}

/* المحتوى */

main{
    max-width:1100px;
    margin:auto;
    padding:20px 15px 60px;
}

.section-title{
    font-size:22px;
    font-weight:800;
    margin:10px 0 18px;
}

/* بطاقة الفيلم */

.card{
    max-width:260px;
    margin:auto;
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.poster{
    width:100%;
    aspect-ratio:2/3;
    background:#202020;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.info{
    padding:15px;
}

.title{
    font-size:18px;
    font-weight:800;
    margin-bottom:7px;
}

.meta{
    color:#999;
    font-size:13px;
    margin-bottom:12px;
}

.description{
    color:#bbb;
    font-size:13px;
    line-height:1.7;
    margin-bottom:15px;
}

/* زر المشاهدة */

.watch-button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:#fff;
    color:#000;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.watch-button:active{
    transform:scale(.98);
}

/* المشغل */

.player-container{
    display:none;
    margin-top:30px;
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:14px;
}

.player-container.show{
    display:block;
}

.player-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:12px;
}

video{
    width:100%;
    max-height:70vh;
    display:block;
    background:#000;
    border-radius:12px;
}

.close-button{
    margin-top:12px;
    border:0;
    border-radius:10px;
    padding:10px 16px;
    background:#292929;
    color:white;
    font-size:14px;
    cursor:pointer;
}

.status{
    text-align:center;
    color:#888;
    margin-top:15px;
    font-size:13px;
}

</style>

</head>

<body>

<header>

<div class="logo">
🎬 Watch Enjoy
</div>

</header>


<main>

<div class="section-title">
🎬 فيلم تجريبي
</div>


<!-- بطاقة الفيلم -->

<div class="card">

<div class="poster">

<img
src="https://image.tmdb.org/t/p/w500/bjiS5ipwxb9JFy3XRRN4OAilSeX.jpg"
alt="فيلم تجريبي">

</div>


<div class="info">

<div class="title">
فيلم تجريبي
</div>

<div class="meta">
🎬 فيلم • تجربة المشاهدة
</div>

<div class="description">
هذه بطاقة تجريبية للتأكد من أن زر المشاهدة
والمشغل يعملان داخل الموقع.
</div>

<button
class="watch-button"
onclick="startMovie()">

▶ مشاهدة

</button>

</div>

</div>


<!-- مشغل الفيديو -->

<div
class="player-container"
id="playerContainer">

<div
class="player-title"
id="playerTitle">

🎬 المشاهدة الآن

</div>


<video
id="videoPlayer"
controls
playsinline
preload="metadata">

<source
id="videoSource"
src=""
type="video/mp4">

المتصفح لا يدعم تشغيل الفيديو.

</video>


<button
class="close-button"
onclick="closePlayer()">

✕ إغلاق المشغل

</button>


<div
class="status"
id="playerStatus">

يتم تشغيل الفيديو داخل الموقع.

</div>

</div>

</main>


<script>

/*
========================================
رابط فيديو تجريبي مرخّص
========================================

هذا الرابط يستخدم لاختبار المشغل فقط.
بعد التأكد أن المشغل يعمل،
يمكن استبداله برابط فيديو قانوني مباشر
خاص بالمحتوى الذي تملك حق تشغيله.
*/

const DEMO_VIDEO =
"https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4";


function startMovie(){

const playerContainer =
document.getElementById(
"playerContainer"
);

const video =
document.getElementById(
"videoPlayer"
);

const source =
document.getElementById(
"videoSource"
);

const title =
document.getElementById(
"playerTitle"
);


title.innerText =
"🎬 المشاهدة الآن";

source.src =
DEMO_VIDEO;

video.load();

playerContainer.classList.add(
"show"
);


window.scrollTo({

top:
playerContainer.offsetTop - 20,

behavior:
"smooth"

});


video.play().catch(() => {

document.getElementById(
"playerStatus"
).innerText =
"اضغط ▶ داخل المشغل لبدء الفيديو.";

});

}


function closePlayer(){

const video =
document.getElementById(
"videoPlayer"
);

video.pause();

video.currentTime = 0;

document.getElementById(
"playerContainer"
).classList.remove(
"show"
);

}

</script>

</body>

</html>
