<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watch Enjoy 🎬</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#070707;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
padding:28px 16px 22px;
text-align:center;
background:linear-gradient(180deg,#1b1b1b,#070707);
}

.logo{
font-size:32px;
font-weight:800;
}

.subtitle{
color:#999;
margin-top:7px;
margin-bottom:20px;
}

.search{
width:100%;
max-width:550px;
padding:15px;
border-radius:14px;
border:1px solid #333;
background:#151515;
color:white;
font-size:16px;
outline:none;
}

main{
padding:20px 16px 40px;
}

h2{
font-size:22px;
margin:20px 0 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.card{
background:#151515;
border:1px solid #242424;
border-radius:16px;
overflow:hidden;
}

.poster{
width:100%;
height:250px;
object-fit:cover;
display:block;
}

.info{
padding:14px;
}

.title{
font-size:18px;
font-weight:bold;
}

.type{
color:#999;
font-size:13px;
margin-top:5px;
}

.description{
color:#aaa;
font-size:13px;
line-height:1.6;
margin-top:8px;
}

.watch{
display:block;
margin-top:13px;
padding:12px;
border-radius:10px;
background:white;
color:black;
text-decoration:none;
text-align:center;
font-weight:bold;
}

.player{
display:none;
margin-bottom:30px;
background:#111;
padding:15px;
border-radius:16px;
}

.player video{
width:100%;
border-radius:12px;
background:black;
}

.player-title{
font-size:20px;
font-weight:bold;
margin:12px 0;
}

.close{
padding:10px 18px;
border:0;
border-radius:10px;
background:#292929;
color:white;
font-size:15px;
}

footer{
text-align:center;
padding:30px;
color:#666;
}

@media(min-width:700px){

.grid{
grid-template-columns:repeat(4,1fr);
}

}

</style>

</head>


<body>


<header>

<div class="logo">
🎬 Watch Enjoy
</div>

<div class="subtitle">
أفلام ومسلسلات
</div>

<input
class="search"
id="search"
type="search"
placeholder="🔎 ابحث عن فيلم..."
oninput="searchMovies()">

</header>


<main>


<!-- مشغل الفيلم -->

<div
class="player"
id="player">

<div
class="player-title"
id="playerTitle">
🎬 المشاهدة
</div>

<video
id="video"
controls
playsinline>

<source
id="videoSource"
src=""
type="video/webm">

متصفحك لا يدعم تشغيل الفيديو.

</video>

<br>

<button
class="close"
onclick="closePlayer()">

✕ إغلاق

</button>

</div>


<h2>
🔥 الأفلام
</h2>


<div class="grid">


<!-- The General -->

<div class="card">

<img
class="poster"
src="https://commons.wikimedia.org/wiki/Special:Redirect/file/The_General_(1926)_-_Movie_Poster.png"
alt="The General 1926">

<div class="info">

<div class="title">
The General
</div>

<div class="type">
فيلم كوميدي صامت — 1926
</div>

<div class="description">

فيلم كلاسيكي من بطولة
Buster Keaton.

</div>

<a
class="watch"
href="#"
onclick="playMovie();return false;">

▶ مشاهدة الفيلم

</a>

</div>

</div>


<!-- فيلم ثاني تجريبي -->

<div class="card">

<div
class="poster"
style="
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#333,#111);
font-size:60px;
">

🎬

</div>

<div class="info">

<div class="title">
فيلم جديد
</div>

<div class="type">
قريبًا
</div>

<div class="description">
سيتم إضافة محتوى مرخّص.
</div>

<a
class="watch"
href="#"
onclick="alert('سيتم إضافة الفيلم قريبًا');return false;">

▶ مشاهدة

</a>

</div>

</div>


</div>


<h2>
📺 المسلسلات
</h2>


<div class="grid">


<div class="card">

<div
class="poster"
style="
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#333,#111);
font-size:60px;
">

📺

</div>

<div class="info">

<div class="title">
مسلسل جديد
</div>

<div class="type">
قريبًا
</div>

<div class="description">
سيتم إضافة مسلسلات مرخّصة.
</div>

<a
class="watch"
href="#"
onclick="alert('سيتم إضافة المسلسل قريبًا');return false;">

▶ مشاهدة

</a>

</div>

</div>


</div>


</main>


<footer>

Watch Enjoy © 2026

</footer>


<script>


function playMovie(){

let player =
document.getElementById("player");

let video =
document.getElementById("video");

let source =
document.getElementById("videoSource");

let title =
document.getElementById("playerTitle");


title.innerText =
"🎬 The General — 1926";


/*
ملف الفيديو العام للتجربة
*/

source.src =
"https://commons.wikimedia.org/wiki/Special:Redirect/file/The_General_1926_720p.webm";


video.load();

player.style.display =
"block";

window.scrollTo({
top:0,
behavior:"smooth"
});

video.play().catch(function(){

});

}


function closePlayer(){

let player =
document.getElementById("player");

let video =
document.getElementById("video");

video.pause();

player.style.display =
"none";

}


function searchMovies(){

let text =
document
.getElementById("search")
.value
.toLowerCase();


document
.querySelectorAll(".card")
.forEach(function(card){

let title =
card
.querySelector(".title")
.innerText
.toLowerCase();


if(title.includes(text)){

card.style.display =
"block";

}else{

card.style.display =
"none";

}

});

}

</script>


</body>

</html>
