<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Enjoy 🎬</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:25px 18px;
background:linear-gradien(#171717,#080808);
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
}

.subtitle{
color:#aaa;
margin:8px 0 18px;
}

.search{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #333;
background:#181818;
color:white;
font-size:16px;
outline:none;
}

main{
padding:20px;
}

h2{
font-size:21px;
margin:25px 0 14px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}

.card{
background:#151515;
border-radius:15px;
overflow:hidden;
border:1px solid #242424;
}

.poster{
height:190px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
background:linear-gradient(135deg,#333,#111);
}

.info{
padding:13px;
}

.title{
font-size:17px;
font-weight:bold;
}

.type{
font-size:13px;
color:#999;
margin-top:5px;
}

.watch{
display:block;
margin-top:12px;
padding:10px;
border-radius:9px;
background:white;
color:black;
text-align:center;
text-decoration:none;
font-weight:bold;
}

footer{
text-align:center;
padding:30px;
color:#666;
}

@media(min-width:700px){
.grid{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<header>

<div class="logo">🎬 Watch Enjoy</div>

<div class="subtitle">
أفلام ومسلسلات
</div>

<input
class="search"
id="search"
placeholder="🔎 ابحث عن فيلم أو مسلسل..."
oninput="searchMovies()">

</header>

<main>

<h2>🔥 الأفلام</h2>

<div class="grid">

<div class="card">

<="watch"
href="https://www.youtube.com/

</div>
</div>


<div class="card">

<div class="poster">🎥</div>

<div class="info">

<div class="title">
فيلم جديد
</div>

<div class="type">
فيلم
<<a
class="watch"
href="watch.html">
▶ مشاهدة
</a>



</div

</div


<h2>📺 المسلسلات</h2>

<div class="grid">

<div class="card">

<div class="poster">📺</div>

<div class="info">

<div class="title">
مسلسل جديد
</div>

<div class="type">
مسلسل
</div>

<a
class="watch"

onclick="alert('أضف رابط المشاهدة الرسمي هنا')">

</div>


<div class="card">

</div>

▶ مشاهدة
</a>

</div>
</div>

</div>

</main>

<footer>
Watch Enjoy © 2026
</footer>


<script>

function searchMovies(){

let text=document
.getElementById("search")
.value
.toLowerCase();

let cards=document
.querySelectorAll(".card");

cards.forEach(function(card){

let title=card
.querySelector(".title")
.innerText
.toLowerCase();

if(title.includes(text)){
card.style.display="block";
}else{
card.style.display="none";
}

});

}

</script>

</body>
</html>
